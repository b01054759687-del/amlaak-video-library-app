<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800;900&family=Almarai:wght@400;700&family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root {
    --amlaak-navy-dark: #070D18;
    --amlaak-navy: #0B1528;
    --amlaak-navy-card: #0F1D38;
    --amlaak-slate: #1E293B;
    --amlaak-slate-light: #334155;
    --amlaak-gold: #C5A059;
    --amlaak-gold-light: #DFBF7A;
    --amlaak-gold-subtle: rgba(197, 160, 89, 0.12);
    --amlaak-gold-border: rgba(197, 160, 89, 0.3);
    
    --font-heading: 'Alexandria', 'Cairo', sans-serif;
    --font-body: 'Almarai', 'Cairo', sans-serif;
    --font-num: 'Outfit', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: var(--font-body);
    background-color: var(--amlaak-navy-dark);
    background-image: 
      radial-gradient(circle at 10% 10%, rgba(197, 160, 89, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(15, 29, 56, 0.45) 0%, transparent 50%),
      linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
    color: #F1F5F9;
    min-height: 100vh;
    direction: rtl;
    text-align: right;
  }

  h1, h2, h3, h4, h5, h6, .brand-title {
    font-family: var(--font-heading);
  }

  .font-num {
    font-family: var(--font-num);
    direction: ltr;
    display: inline-block;
  }

  .font-mono-code {
    font-family: var(--font-mono);
    direction: ltr;
    text-align: left;
  }

  /* Gold Gradient & Accents */
  .gold-gradient-text {
    background: linear-gradient(135deg, #FFF0C2 0%, #C5A059 50%, #9A7329 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .gold-card {
    background: rgba(15, 29, 56, 0.75);
    backdrop-filter: blur(14px);
    border: 1px solid var(--amlaak-gold-border);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    transition: all 0.25s ease;
  }

  .gold-card:hover {
    border-color: rgba(197, 160, 89, 0.55);
  }

  .gold-btn {
    background: linear-gradient(135deg, #D4AF65 0%, #C5A059 100%);
    color: #070D18;
    font-weight: 700;
    transition: all 0.2s ease;
  }

  .gold-btn:hover {
    background: linear-gradient(135deg, #E6C47E 0%, #D4AF65 100%);
    box-shadow: 0 6px 20px rgba(197, 160, 89, 0.3);
    transform: translateY(-1px);
  }

  .gold-btn:active {
    transform: translateY(1px);
  }

  /* Form Elements */
  .input-dark {
    background-color: #081120;
    border: 1px solid rgba(197, 160, 89, 0.25);
    color: #FFFFFF;
    transition: all 0.2s ease;
  }

  .input-dark:focus {
    outline: none;
    border-color: #C5A059;
    box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.18);
  }

  select.input-dark option {
    background-color: #0B1528;
    color: #FFFFFF;
  }

  /* Scrollbars */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: #070D18;
  }
  ::-webkit-scrollbar-thumb {
    background: #334155;
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #C5A059;
  }

  /* Badges */
  .badge-current {
    background-color: rgba(16, 185, 129, 0.15);
    color: #34D399;
    border: 1px solid rgba(16, 185, 129, 0.35);
  }

  .badge-previous {
    background-color: rgba(148, 163, 184, 0.12);
    color: #94A3B8;
    border: 1px solid rgba(148, 163, 184, 0.25);
  }

  .badge-project {
    background-color: rgba(197, 160, 89, 0.15);
    color: #DFBF7A;
    border: 1px solid rgba(197, 160, 89, 0.35);
  }

  .badge-marketing {
    background-color: rgba(59, 130, 246, 0.15);
    color: #60A5FA;
    border: 1px solid rgba(59, 130, 246, 0.35);
  }

  /* Custom Loading Overlay */
  .loader-spinner {
    border: 3px solid rgba(197, 160, 89, 0.2);
    border-top: 3px solid #C5A059;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Autocomplete Dropdown */
  .autocomplete-items {
    position: absolute;
    border: 1px solid rgba(197, 160, 89, 0.3);
    z-index: 99;
    top: 100%;
    left: 0;
    right: 0;
    background: #0B1528;
    border-radius: 0.5rem;
    max-height: 180px;
    overflow-y: auto;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
  }

  .autocomplete-item {
    padding: 8px 12px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    transition: background 0.15s;
  }

  .autocomplete-item:hover, .autocomplete-active {
    background-color: rgba(197, 160, 89, 0.2);
    color: #DFBF7A;
  }
</style>
